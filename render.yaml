services:
  # Backend API (FastAPI)
  - type: web
    name: parkshare-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: parkshare-db
          property: connectionString
      - key: RAZORPAY_MOCK_MODE
        value: "true"
      - key: RAZORPAY_KEY_ID
        value: "rzp_test_parkshare_mock_key"
      - key: RAZORPAY_KEY_SECRET
        value: "rzp_test_parkshare_mock_secret"
      - key: PLATFORM_COMMISSION_PERCENTAGE
        value: "10.0"
      - key: TAX_PERCENTAGE
        value: "5.0"

  # Customer Web App (React + Vite)
  - type: static
    name: parkshare-customer
    rootDir: customer-web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Host Web App (React + Vite)
  - type: static
    name: parkshare-host
    rootDir: host-web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Admin Web App (React + Vite)
  - type: static
    name: parkshare-admin
    rootDir: admin-web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # Managed PostgreSQL Database
  - name: parkshare-db
    databaseName: parkshare
    user: parkshare
    plan: free
